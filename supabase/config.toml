project_id = "pidebeat"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/dj/login"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.get-public-event]
enabled = true
verify_jwt = false
entrypoint = "./functions/get-public-event/index.ts"

[functions.submit-song-request]
enabled = true
verify_jwt = false
entrypoint = "./functions/submit-song-request/index.ts"

[functions.public-raffle]
enabled = true
verify_jwt = false
entrypoint = "./functions/public-raffle/index.ts"
